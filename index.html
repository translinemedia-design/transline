<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Transline</title>
<meta name="theme-color" content="#164B77">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Transline">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="config.js"></script>
<style>
:root{--oscuro:#164B77;--azul:#2981C4;--celeste:#66C0DC;--fondo:#F4F2F4;--texto:#1F2A36;--suave:#5B6775;--linea:#D5DEE7;--alerta:#B3261E}
*{box-sizing:border-box}
html,body{overscroll-behavior-y:contain;margin:0;background:var(--fondo);color:var(--texto);font-family:'Poppins','Segoe UI',Arial,sans-serif;font-size:15px;line-height:1.45}
header{background:var(--oscuro);color:#fff;padding:calc(16px + env(safe-area-inset-top,0px)) 18px 22px}
header .in{max-width:760px;margin:0 auto}
header .fila{display:flex;align-items:center;justify-content:space-between;gap:12px}
header img{height:28px;display:block}
.usuario{display:flex;align-items:center;gap:10px;font-size:13px;color:#DCEEF6}
.usuario button{border:1px solid rgba(255,255,255,.5);background:none;color:#fff;border-radius:999px;padding:5px 12px;font:inherit;font-size:12px;cursor:pointer}
.saludo{margin-top:16px}
.saludo h1{margin:0;font-size:22px;font-weight:600}
.saludo p{margin:2px 0 0;color:var(--celeste);font-size:14px}
main{max-width:760px;margin:0 auto;padding:16px 16px calc(28px + env(safe-area-inset-bottom,0px))}
.aviso{padding:12px 14px;border-radius:10px;font-size:14px;margin-bottom:14px}
.aviso.error{background:#FCE4E4;color:var(--alerta)}
.aviso.info{background:#DCEEF6;color:var(--oscuro)}
.area{margin-bottom:22px}
.area h2{margin:0 0 10px;font-size:14px;font-weight:600;color:var(--suave);letter-spacing:.4px;text-transform:uppercase}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.tile{position:relative;display:flex;flex-direction:column;gap:6px;min-height:118px;background:#fff;border-radius:14px;padding:14px;text-decoration:none;color:var(--texto);border:1.5px solid transparent}
.tile:hover{border-color:var(--celeste)}
.tile .ic{width:38px;height:38px;border-radius:10px;background:#DCEEF6;color:var(--oscuro);display:flex;align-items:center;justify-content:center}
.tile .ic svg{width:22px;height:22px}
.tile .t{font-weight:600;font-size:15px;line-height:1.25}
.tile .d{font-size:12.5px;color:var(--suave);line-height:1.35}
.tile .badge{position:absolute;top:12px;right:12px;min-width:24px;padding:0 7px;border-radius:999px;background:var(--alerta);color:#fff;font-size:13px;font-weight:700;line-height:24px;text-align:center}
.tile .ext{position:absolute;top:14px;right:14px;font-size:11px;color:var(--suave)}
.tile.prox{background:transparent;border:1.5px dashed var(--linea);cursor:default}
.tile.prox .ic{background:#EEF1F5;color:var(--suave)}
.tile.prox .t{color:var(--suave)}
.login{max-width:380px;margin:30px auto;background:#fff;border-radius:16px;padding:22px;text-align:center}
.login h2{color:var(--oscuro);margin:0 0 6px;font-size:20px}
.login p{color:var(--suave);margin:0 0 18px}
.login input{width:100%;min-height:58px;font-size:28px;letter-spacing:10px;text-align:center;border:1.5px solid var(--linea);border-radius:12px;margin-bottom:12px;font-family:inherit}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:52px;border:0;border-radius:12px;background:var(--azul);color:#fff;font-weight:600;font-size:16px;cursor:pointer;font-family:inherit}
.btn:disabled{opacity:.55}
.pie{text-align:center;color:var(--suave);font-size:12px;margin-top:10px}
.oculto{display:none !important}
</style>
</head>

    { t: 'Cotizaciones', d: 'Proformas para clientes', ic: 'doc', prox: true },
    { t: 'Leads de WhatsApp', d: 'Registro y seguimiento de leads', ic: 'chat', prox: true }
  ] },
  { nombre: 'Compras', modulos: [
    { t: 'Evaluación de proveedores', d: 'Ranking, precios y plan de compra', ic: 'carrito', href: () => CFG.COMPRAS_URL, ver: () => !!rol('compras'), externo: true },
    { t: 'Órdenes de compra', d: 'Solicitudes, órdenes y recepción', ic: 'doc', prox: true }
  ] },
  { nombre: 'Logística', modulos: [
    { t: 'Recepción de devoluciones', d: 'Equipos avisados que están por llegar', ic: 'caja', href: () => 'devoluciones/?vista=porrecibir', ver: () => dev('Almacén', 'Administrador'), contador: 'porRecibir' },
    { t: 'Etiquetas por imprimir', d: 'Etiquetas de bulto pendientes', ic: 'impresora', href: () => 'devoluciones/?vista=pendientes', ver: () => dev('Almacén', 'Administrador'), contador: 'porImprimir' },
    { t: 'Inventario', d: 'Entradas, salidas y stock', ic: 'estante', prox: true }
  ] },
  { nombre: 'Postventa', modulos: [
    { t: 'Devoluciones y garantías', d: 'Registrar avisos y devoluciones', ic: 'retorno', href: () => 'devoluciones/?vista=registrar', ver: () => dev('Vendedor', 'Almacén', 'Administrador') },
    { t: 'Servicio técnico', d: 'Casos por revisar y diagnóstico', ic: 'llave', href: () => 'devoluciones/?vista=revision', ver: () => dev('Servicio técnico', 'Administrador'), contador: 'porRevisar' },
    { t: 'Buscar caso', d: 'Consultar y compartir seguimiento', ic: 'lupa', href: () => 'devoluciones/?vista=buscar', ver: () => !!rol('devoluciones') }
  ] },
  { nombre: 'Gerencia', modulos: [
    { t: 'Garantías por modelo', d: 'Ficha y resumen de fallas', ic: 'grafico', href: () => CFG.GARANTIAS_HOJA_URL, ver: () => esAdmin(), externo: true },
    { t: 'Indicadores', d: 'Tablero de todas las áreas', ic: 'grafico', prox: true }
  ] }
];

function mensaje(tipo, texto) { $('#msg').innerHTML = texto ? '<div class="aviso ' + tipo + '">' + esc(texto) + '</div>' : ''; }

async function api(url, fn, args) {
  if (!urlValida(url)) throw new Error('Falta configurar la dirección del motor en config.js.');
  let r;
  try {
    const resp = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ fn: fn, args: args || [], pin: SESION ? SESION.pin : '' }) });
    r = await resp.json();
  } catch (e) { throw new Error('Sin conexión. Revisa el internet e intenta de nuevo.'); }
  if (!r.ok) throw new Error(r.error === 'pin' ? 'pin' : r.error);
  return r.data;
}

/* ---------- ingreso ---------- */
function mostrarLogin(texto) {
  $('#v-inicio').classList.add('oculto'); $('#usuario').classList.add('oculto'); $('#saludo').classList.add('oculto');
  $('#v-login').classList.remove('oculto');
  mensaje(texto ? 'error' : '', texto || '');
  $('#pin').value = ''; setTimeout(() => $('#pin').focus(), 50);
}
async function entrar() {
  const pin = $('#pin').value.trim();
  if (!/^\d{6}$/.test(pin)) { mensaje('error', 'El PIN tiene exactamente 6 números.'); return; }
  const btn = $('#btn-entrar'); btn.disabled = true; btn.textContent = 'Verificando…';
  SESION = { pin: pin };
  try {
    const u = await api(CFG.PORTAL_API_URL, 'login');
    SESION = { pin: pin, nombre: u.nombre, area: u.area, modulos: u.modulos };
    try { localStorage.setItem('tl_portal', JSON.stringify(SESION)); } catch (e) {}
    mensaje('', ''); mostrarInicio();
  } catch (err) {
    SESION = null;
    mensaje('error', err.message === 'pin' ? 'PIN incorrecto o sin acceso a ningún módulo.' : err.message);
  } finally { btn.disabled = false; btn.textContent = 'Entrar'; }
}
function salir() {
  try { localStorage.removeItem('tl_portal'); } catch (e) {}
  SESION = null; CONTADORES = {}; mostrarLogin('');
}

/* ---------- inicio ---------- */
function mostrarInicio() {
  $('#v-login').classList.add('oculto');
  $('#usuario').classList.remove('oculto'); $('#saludo').classList.remove('oculto');
  $('#u-area').textContent = SESION.area || '';
  const h = new Date().getHours();
  $('#hola').textContent = (h < 12 ? 'Buenos días' : h < 19 ? 'Buenas tardes' : 'Buenas noches') + ', ' + SESION.nombre;
  $('#fecha').textContent = new Date().toLocaleDateString('es-PE', { weekday: 'long', day: 'numeric', month: 'long' });
  pintarInicio();
  $('#v-inicio').classList.remove('oculto');
  cargarContadores();
}
function pintarInicio() {
  const admin = esAdmin();
  const html = AREAS.map((a) => {
    const tiles = a.modulos.filter((m) => m.prox ? admin : m.ver()).map((m) => {
      if (m.prox) return '<div class="tile prox"><span class="ic">' + icono(m.ic) + '</span><span class="t">' + esc(m.t) + '</span><span class="d">Próximamente</span></div>';
      const n = m.contador ? (CONTADORES[m.contador] || 0) : 0;
      const marca = n ? '<span class="badge">' + n + '</span>' : (m.externo ? '<span class="ext">↗</span>' : '');
      return '<a class="tile" href="' + esc(m.href() || '#') + '"><span class="ic">' + icono(m.ic) + '</span><span class="t">' + esc(m.t) + '</span><span class="d">' + esc(m.d) + '</span>' + marca + '</a>';
    }).join('');
    return tiles ? '<div class="area"><h2>' + esc(a.nombre) + '</h2><div class="grid">' + tiles + '</div></div>' : '';
  }).join('');
  $('#v-inicio').innerHTML = html || '<div class="aviso info">Tu usuario todavía no tiene módulos asignados. Pide acceso a la administración.</div>';
}
async function cargarContadores() {
  if (!SESION || !rol('devoluciones')) return;
  const url = CFG.DEVOLUCIONES_API_URL;
  const tareas = [];
  if (dev('Almacén', 'Administrador')) {
    tareas.push(api(url, 'porRecibir').then((l) => { CONTADORES.porRecibir = l.length; }).catch(() => {}));
    tareas.push(api(url, 'etiquetasPendientes').then((l) => { CONTADORES.porImprimir = l.length; }).catch(() => {}));
  }
  if (dev('Servicio técnico', 'Administrador')) {
    tareas.push(api(url, 'porRevisar').then((l) => { CONTADORES.porRevisar = l.filter((c) => c.estado !== 'En revisión').length; }).catch(() => {}));
  }
  await Promise.all(tareas);
  pintarInicio();
}

/* ---------- arranque ---------- */
$('#btn-entrar').addEventListener('click', entrar);
$('#pin').addEventListener('keydown', (e) => { if (e.key === 'Enter') entrar(); });
// Solo números, máximo 6; al completar el sexto dígito entra solo
$('#pin').addEventListener('input', (e) => {
  const v = e.target.value.replace(/\D/g, '').slice(0, 6);
  if (v !== e.target.value) e.target.value = v;
  if (v.length === 6 && !$('#btn-entrar').disabled) entrar();
});
$('#btn-salir').addEventListener('click', salir);
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
setInterval(() => { if (SESION && SESION.nombre) cargarContadores(); }, 60000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && SESION && SESION.nombre) cargarContadores(); });

(async function iniciar() {
  try { SESION = JSON.parse(localStorage.getItem('tl_portal') || 'null'); } catch (e) { SESION = null; }
  if (!SESION || !SESION.pin) { mostrarLogin(''); return; }
  mostrarInicio();
  // Revalida el PIN en segundo plano (por si cambió el rol o se desactivó el usuario)
  try {
    const u = await api(CFG.PORTAL_API_URL, 'login');
    SESION = Object.assign(SESION, { nombre: u.nombre, area: u.area, modulos: u.modulos });
    localStorage.setItem('tl_portal', JSON.stringify(SESION));
    mostrarInicio();
  } catch (err) { if (err.message === 'pin') { salir(); mensaje('error', 'Tu PIN ya no es válido. Ingresa de nuevo.'); } }
})();
</script>
